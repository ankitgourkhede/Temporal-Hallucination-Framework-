# TrustRAG temporal benchmark: source of truth.
#
# Everything in data/benchmark_corpus/, data/benchmark/benchmark.csv and
# data/train/queries_labeled.csv is generated from this file by
#   python -m scripts.build_dataset
#
# CONTENT IS SYNTHETIC. Documents are modelled on the shape and history of real
# public travel-policy pages (for example Vietnam's 2023 move from 30- to 90-day
# e-visas, the UK allowance rising from GBP 145 to GBP 390, India's
# duty-free limit going from INR 35,000 to INR 50,000), but the values were not
# verified against live government sources and must not be used as travel advice.
# Every URL uses the reserved ".example" TLD so nothing points at a real agency.
#
# Each document declares `claims`: the slot values it is written to assert. The
# generator runs the project's own claim extractor (trustrag.online.retrieval.evidence)
# over the text and fails if the extracted values differ, so gold labels and
# extractor behaviour cannot silently drift apart.
#
# Fields
#   scope         nationality_scope codes (IN, GB, US, AU, CA, JP) or ALL
#   content_date  when the content was written / last changed
#   snapshot_date when it was crawled (for primary sources this is last_verified_ts)
#   truth         gold slot values for the fact's traveller nationality as of `as_of_date`
#   questions     one per gold slot; each entry's `queries` are paraphrases that share
#                 a paraphrase_group and therefore always land in the same split

as_of_date: "2026-11-09"
current_snapshot: "2026-11-01"

